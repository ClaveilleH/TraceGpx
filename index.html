<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TraceGPX — Plan IGN</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f4f1ea;
    --panel: #fbf9f4;
    --ink: #2a2620;
    --moss: #4a5d3a;
    --moss-dk: #36462a;
    --rust: #b5532a;
    --line: #d8d2c4;
    --shadow: 0 2px 12px rgba(42,38,32,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Spline Sans Mono', monospace;
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; z-index: 1; }

  /* ---- Panneau de contrôle ---- */
  .panel {
    position: absolute; top: 16px; left: 16px; z-index: 1000;
    width: 280px; max-width: calc(100vw - 32px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel header {
    background: var(--moss);
    color: #f4f1ea;
    padding: 14px 16px;
  }
  .panel header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: .3px;
  }
  .panel header p { font-size: 11px; opacity: .8; margin-top: 2px; }
  .panel .body { padding: 14px 16px; }

  .toggle-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .toggle-row button {
    flex: 1; padding: 7px 0; font-size: 11px; cursor: pointer;
    font-family: inherit; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 6px;
    transition: all .15s;
  }
  .toggle-row button.active { background: var(--moss); color: #fff; border-color: var(--moss); }

  .mode-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 12px; }
  .switch { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
  .switch input { display: none; }
  .slider {
    position: absolute; inset: 0; background: #cfc8b8; border-radius: 21px;
    cursor: pointer; transition: .2s;
  }
  .slider::before {
    content: ""; position: absolute; width: 15px; height: 15px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: var(--rust); }
  .switch input:checked + .slider::before { transform: translateX(17px); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .stat .label { font-size: 9px; text-transform: uppercase; letter-spacing: .6px; opacity: .55; }
  .stat .val { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; margin-top: 1px; }
  .stat .val small { font-size: 11px; font-weight: 400; opacity: .6; }

  .actions { display: flex; flex-direction: column; gap: 7px; }
  .actions button {
    padding: 9px; font-size: 12px; cursor: pointer; font-family: inherit;
    border-radius: 6px; border: 1px solid transparent; transition: all .15s;
  }
  .btn-primary { background: var(--rust); color: #fff; }
  .btn-primary:hover { background: #9c4422; }
  .btn-ghost { background: #fff; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { background: #f0ece2; }
  .actions button:disabled { opacity: .4; cursor: not-allowed; }

  /* ---- Sélecteur de couleur du tracé ---- */
  .color-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px; font-size: 12px;
  }
  .color-row .swatches { display: flex; gap: 5px; flex: 1; }
  .color-row .sw {
    width: 20px; height: 20px; border-radius: 50%;
    cursor: pointer; border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--line); transition: transform .12s;
  }
  .color-row .sw:hover { transform: scale(1.15); }
  .color-row .sw.active { box-shadow: 0 0 0 2px var(--ink); }
  .color-row .picker {
    width: 22px; height: 22px; padding: 0; cursor: pointer;
    border: 1px solid var(--line); border-radius: 4px;
    background: #fff; overflow: hidden;
  }
  .color-row .picker::-webkit-color-swatch-wrapper { padding: 0; }
  .color-row .picker::-webkit-color-swatch { border: none; border-radius: 3px; }

  /* ---- Profil altimétrique ---- */
  .elev {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
    height: 150px; background: var(--panel); border-top: 1px solid var(--line);
    box-shadow: 0 -2px 12px rgba(42,38,32,.1);
    transform: translateY(100%); transition: transform .3s ease;
  }
  .elev.show { transform: translateY(0); }
  .elev.resizing { transition: none; user-select: none; }
  .elev .resizer {
    position: absolute; top: 0; left: 0; right: 0;
    height: 14px; cursor: ns-resize; z-index: 1001;
    background: #ece6d6;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .elev .resizer::before {
    content: ""; width: 50px; height: 4px;
    border-radius: 3px; background: #b8b0a0;
    transition: background .15s;
  }
  .elev .resizer:hover { background: #e0d8c5; }
  .elev .resizer:hover::before { background: var(--moss); }
  .elev .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 16px; font-size: 11px; border-bottom: 1px solid var(--line);
    height: 28px; margin-top: 14px;
  }
  .elev .head strong { font-family: 'Fraunces', serif; font-size: 13px; }
  .elev .head .ctrls { display: flex; gap: 10px; align-items: center; }
  .elev .head select {
    font-family: inherit; font-size: 11px; padding: 2px 6px;
    border: 1px solid var(--line); border-radius: 4px;
    background: #fff; color: var(--ink); cursor: pointer;
  }
  .elev .head .min-btn {
    width: 24px; height: 22px; border: 1px solid var(--line);
    background: #fff; border-radius: 4px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink); padding: 0; font-family: inherit;
    transition: background .15s, border-color .15s;
  }
  .elev .head .min-btn:hover { background: var(--moss); color: #fff; border-color: var(--moss); }
  .elev .head .min-btn svg { width: 12px; height: 12px; display: block; }
  /* État minimisé : on cache le contenu, on garde la barre de titre */
  .elev.minimized { height: auto !important; }
  .elev.minimized .resizer { display: none; }
  .elev.minimized .head { margin-top: 0; border-bottom: none; }
  .elev.minimized .svg-wrap { display: none; }
  .elev .svg-wrap { position: relative; height: calc(100% - 42px); }
  .elev svg { display: block; width: 100%; height: 100%; }
  .elev-cursor {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: var(--ink); opacity: .45; pointer-events: none;
    display: none;
  }
  .elev-tooltip {
    position: absolute; pointer-events: none; display: none;
    background: rgba(42,38,32,.92); color: #f4f1ea;
    padding: 5px 9px; border-radius: 5px;
    font-size: 11px; white-space: nowrap;
    transform: translate(-50%, -100%); margin-top: -6px;
    z-index: 10; line-height: 1.4;
  }
  .elev-tooltip b { font-weight: 600; color: #fff; }

  .hint {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 999; background: rgba(42,38,32,.85); color: #f4f1ea;
    padding: 8px 16px; border-radius: 20px; font-size: 11px;
    pointer-events: none; transition: opacity .3s;
  }
  .leaflet-container { background: #e8e3d8; }
  .attribution-note { font-size: 9px; opacity: .5; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>

<div id="map"></div>

<div class="panel">
  <header>
    <h1>TraceGPX</h1>
    <p>Plan IGN · tracé de randonnée</p>
  </header>
  <div class="body">
    <div class="toggle-row" id="layers">
      <button data-layer="topo" class="active">OpenTopo</button>
      <button data-layer="photo">Satellite</button>
      <button data-layer="plan">Plan IGN</button>
    </div>

    <div class="mode-row">
      <label class="switch">
        <input type="checkbox" id="snap" checked>
        <span class="slider"></span>
      </label>
      <span>Suivre les chemins <em style="opacity:.6">(snap)</em></span>
    </div>

    <div class="color-row">
      <span style="opacity:.7">Couleur</span>
      <div class="swatches" id="colorSwatches">
        <span class="sw active" data-color="#b5532a" style="background:#b5532a" title="Rouille"></span>
        <span class="sw" data-color="#4a5d3a" style="background:#4a5d3a" title="Mousse"></span>
        <span class="sw" data-color="#2a5a8a" style="background:#2a5a8a" title="Bleu"></span>
        <span class="sw" data-color="#6b3a5e" style="background:#6b3a5e" title="Prune"></span>
        <span class="sw" data-color="#2a2620" style="background:#2a2620" title="Encre"></span>
      </div>
      <input type="color" id="colorPicker" class="picker" value="#b5532a" title="Couleur personnalisée">
    </div>

    <div class="stats">
      <div class="stat"><div class="label">Distance</div><div class="val" id="dist">0<small> km</small></div></div>
      <div class="stat"><div class="label">D+ </div><div class="val" id="dplus">0<small> m</small></div></div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="export" disabled>Exporter le GPX</button>
      <button class="btn-ghost" id="undo" disabled>Annuler le dernier point</button>
      <button class="btn-ghost" id="clear" disabled>Tout effacer</button>
    </div>

    <p class="attribution-note">Fonds : Plan IGN / orthophotos © IGN-Géoplateforme.
    Itinéraire & altitude via les services data.geopf.fr.</p>
  </div>
</div>

<div class="elev" id="elevPanel">
  <div class="resizer" id="elevResizer" title="Glisser pour redimensionner"></div>
  <div class="head">
    <strong>Profil altimétrique</strong>
    <div class="ctrls">
      <select id="elevMarks" title="Repères de distance">
        <option value="0">Repères : aucun</option>
        <option value="1">Tous les 1 km</option>
        <option value="5" selected>Tous les 5 km</option>
        <option value="10">Tous les 10 km</option>
      </select>
      <span id="elevRange"></span>
      <button class="min-btn" id="elevMin" title="Réduire / Restaurer" aria-label="Réduire">
        <svg id="elevMinIcon" viewBox="0 0 12 12">
          <line x1="2" y1="9" x2="10" y2="9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="svg-wrap">
    <svg id="elevSvg" viewBox="0 0 800 110" preserveAspectRatio="none"></svg>
    <div class="elev-cursor" id="elevCursor"></div>
    <div class="elev-tooltip" id="elevTooltip"></div>
  </div>
</div>

<div class="hint" id="hint">Clique sur la carte pour poser ton premier point</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------------------------------------------------------------------------
// CONFIG — endpoints publics Géoplateforme (pas de clé nécessaire)
// ---------------------------------------------------------------------------
const WMTS = "https://data.geopf.fr/wmts" +
  "?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0" +
  "&LAYER={layer}&STYLE={style}&FORMAT={format}" +
  "&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}";

const ROUTE_URL = "https://data.geopf.fr/navigation/itineraire";
const ELEV_URL  = "https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevationLine.json";

const layers = {
  plan: L.tileLayer(
    WMTS.replace("{layer}","GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2")
        .replace("{style}","normal").replace("{format}","image/png"),
    { maxZoom: 19, attribution: "© IGN" }),
  photo: L.tileLayer(
    WMTS.replace("{layer}","ORTHOIMAGERY.ORTHOPHOTOS")
        .replace("{style}","normal").replace("{format}","image/jpeg"),
    { maxZoom: 19, attribution: "© IGN" }),
  topo: L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    { maxZoom: 17, subdomains: "abc",
      attribution: "© OpenTopoMap (CC-BY-SA) · données © OpenStreetMap" }),
};

const map = L.map("map", {
  center: [45.05, 6.40], zoom: 12,
  zoomControl: false  // recréé à droite pour libérer le coin haut-gauche
});
L.control.zoom({ position: "topright" }).addTo(map);
layers.topo.addTo(map);

// ---------------------------------------------------------------------------
// ETAT
// ---------------------------------------------------------------------------
let anchors = [];          // points cliqués (L.latLng)
let segments = [];         // tableaux de latlng entre 2 ancres consécutives
let traceColor = "#b5532a"; // couleur du tracé (modifiable par l'utilisateur)
let polyline = L.polyline([], { color: traceColor, weight: 4, opacity: .9 }).addTo(map);
let markers = L.layerGroup().addTo(map);

// assombrit une couleur hex de `amt` (0..1) — pour les contrastes (1er pt, etc.)
function shade(hex, amt) {
  const c = hex.replace("#","");
  const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
  const f = 1 - amt;
  const h = v => Math.max(0, Math.min(255, Math.round(v * f))).toString(16).padStart(2,"0");
  return "#" + h(r) + h(g) + h(b);
}
let elevData = [];         // altitudes échantillonnées
let elevDist = [];         // distances cumulées (m) pour chaque échantillon
let elevPts  = [];         // latlng correspondant à chaque échantillon
let hoverMarker = null;    // marqueur sur la trace au survol du profil

const $ = id => document.getElementById(id);
const snap = $("snap");

// ---------------------------------------------------------------------------
// CLIC CARTE → ajoute une ancre
// ---------------------------------------------------------------------------
map.on("click", async (e) => {
  const pt = e.latlng;
  if (anchors.length === 0) {
    anchors.push(pt);
    segments.push([pt]);
  } else {
    const prev = anchors[anchors.length - 1];
    let seg;
    if (snap.checked) {
      seg = await routeBetween(prev, pt);   // snap-to-route via IGN
    }
    if (!seg) seg = interpolateLine(prev, pt);  // ligne droite échantillonnée
    anchors.push(pt);
    segments.push(seg);
  }
  redraw();
  refreshStats();
});

// échantillonne une ligne droite entre 2 points proportionnellement
// à sa longueur (≈ 1 pt tous les 30 m, pas de plafond). Le sous-
// échantillonnage avant l'appel API (~190 pts max) s'en charge ensuite.
const STRAIGHT_STEP_M = 30;
function interpolateLine(a, b) {
  const distM = a.distanceTo(b);
  const n = Math.max(2, Math.round(distM / STRAIGHT_STEP_M));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    pts.push(L.latLng(a.lat + (b.lat - a.lat) * t,
                      a.lng + (b.lng - a.lng) * t));
  }
  return pts;
}

// ---------------------------------------------------------------------------
// ROUTING (snap-to-route piéton)
// ---------------------------------------------------------------------------
async function routeBetween(a, b) {
  const url = ROUTE_URL +
    `?resource=bdtopo-osrm&profile=pedestrian&optimization=shortest` +
    `&start=${a.lng},${a.lat}&end=${b.lng},${b.lat}` +
    `&geometryFormat=geojson&getSteps=false&crs=EPSG:4326`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const j = await r.json();
    const coords = j.geometry?.coordinates;
    if (!coords) return null;
    return coords.map(c => L.latLng(c[1], c[0]));
  } catch { return null; }
}

// ---------------------------------------------------------------------------
// RENDU
// ---------------------------------------------------------------------------
function fullLine() { return segments.flat(); }

function redraw() {
  polyline.setLatLngs(fullLine());
  polyline.setStyle({ color: traceColor });
  markers.clearLayers();
  // le 1er point reste visuellement distinct (assombri) pour repérer le départ
  const startColor = shade(traceColor, 0.35);
  anchors.forEach((p, i) => {
    L.circleMarker(p, {
      radius: 5, color: "#fff", weight: 2,
      fillColor: i === 0 ? startColor : traceColor, fillOpacity: 1
    }).addTo(markers);
  });
  const has = anchors.length > 0;
  $("undo").disabled = !has;
  $("clear").disabled = !has;
  $("export").disabled = anchors.length < 2;
  $("hint").style.opacity = has ? 0 : 1;
}

// ---------------------------------------------------------------------------
// STATS : distance + altimétrie (D+)
// ---------------------------------------------------------------------------
function refreshStats() {
  const line = fullLine();
  let d = 0;
  for (let i = 1; i < line.length; i++) d += line[i-1].distanceTo(line[i]);
  $("dist").innerHTML = (d/1000).toFixed(2) + "<small> km</small>";
  if (anchors.length >= 2) updateElevation(line);
}

async function updateElevation(line) {
  // échantillonne max ~190 pts (limite raisonnable de l'API)
  const step = Math.max(1, Math.ceil(line.length / 190));
  const sampled = line.filter((_, i) => i % step === 0);
  // distances cumulées en mètres pour chaque échantillon
  const dists = [0];
  for (let i = 1; i < sampled.length; i++) {
    dists.push(dists[i-1] + sampled[i-1].distanceTo(sampled[i]));
  }
  const lon = sampled.map(p => p.lng.toFixed(6)).join("|");
  const lat = sampled.map(p => p.lat.toFixed(6)).join("|");
  try {
    const r = await fetch(`${ELEV_URL}?lon=${lon}&lat=${lat}&resource=ign_rge_alti_wld`);
    const j = await r.json();
    const raw = (j.elevations || []).map((e, i) => ({ z: e.z, d: dists[i], p: sampled[i] }))
      .filter(p => p.z != null && p.z > -1000);
    elevData = raw.map(p => p.z);
    elevDist = raw.map(p => p.d);
    elevPts  = raw.map(p => p.p);
    if (elevData.length) { computeDplus(); drawProfile(); }
  } catch { /* silencieux */ }
}

function computeDplus() {
  let dplus = 0;
  for (let i = 1; i < elevData.length; i++) {
    const diff = elevData[i] - elevData[i-1];
    if (diff > 0) dplus += diff;
  }
  $("dplus").innerHTML = Math.round(dplus) + "<small> m</small>";
}

function drawProfile() {
  const svg = $("elevSvg"); svg.innerHTML = "";
  const W = 800, H = 110, pad = 4;
  const min = Math.min(...elevData), max = Math.max(...elevData);
  const rng = max - min || 1;
  const totalD = elevDist[elevDist.length - 1] || 1;
  // X basé sur la distance cumulée RÉELLE (et non l'index d'échantillon)
  // → garantit que le profil est à l'échelle même quand certains segments
  //   ont peu de points (lignes droites) et d'autres beaucoup (snap).
  const xd = d => pad + (d/totalD) * (W - pad*2);
  const x  = i => xd(elevDist[i]);
  const y  = z => H - pad - ((z-min)/rng) * (H - pad*2);

  // tracé du profil
  let dPath = `M ${x(0)} ${y(elevData[0])}`;
  elevData.forEach((z,i) => { if(i) dPath += ` L ${x(i)} ${y(z)}`; });
  const area = dPath + ` L ${x(elevData.length-1)} ${H} L ${x(0)} ${H} Z`;

  // barres verticales tous les N km
  const kmStep = parseInt($("elevMarks").value, 10) || 0;
  let marks = "";
  if (kmStep > 0) {
    const totalKm = totalD / 1000;
    for (let km = kmStep; km < totalKm; km += kmStep) {
      const xp = xd(km * 1000);
      marks += `<line x1="${xp}" y1="0" x2="${xp}" y2="${H}" `
            + `stroke="#36462a" stroke-width="0.6" stroke-dasharray="2,2" opacity="0.55"/>`
            + `<text x="${xp + 3}" y="10" font-size="9" font-family="Spline Sans Mono, monospace" `
            + `fill="#36462a" opacity="0.75">${km}km</text>`;
    }
  }

  svg.innerHTML =
    `<path d="${area}" fill="${traceColor}" opacity="0.12"/>` +
    `<path d="${dPath}" fill="none" stroke="${traceColor}" stroke-width="2"/>` +
    marks;
  $("elevRange").textContent = `${Math.round(min)}–${Math.round(max)} m`;
  $("elevPanel").classList.add("show");
}

// ---------------------------------------------------------------------------
// EXPORT GPX
// ---------------------------------------------------------------------------
function buildGPX() {
  const line = fullLine();
  const pts = line.map((p,i) => {
    const z = elevData[Math.floor(i/line.length*elevData.length)];
    return `      <trkpt lat="${p.lat.toFixed(6)}" lon="${p.lng.toFixed(6)}">` +
           (z != null ? `<ele>${z.toFixed(1)}</ele>` : "") + `</trkpt>`;
  }).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="TraceGPX" xmlns="http://www.topografix.com/GPX/1/1">
  <trk><name>Trace ${new Date().toISOString().slice(0,10)}</name>
    <trkseg>
${pts}
    </trkseg>
  </trk>
</gpx>`;
}

$("export").onclick = () => {
  const blob = new Blob([buildGPX()], { type: "application/gpx+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `trace-${Date.now()}.gpx`;
  a.click();
};

// ---------------------------------------------------------------------------
// CONTROLES
// ---------------------------------------------------------------------------
$("undo").onclick = () => {
  if (!anchors.length) return;
  anchors.pop(); segments.pop();
  if (anchors.length < 2) { $("elevPanel").classList.remove("show"); $("dplus").innerHTML = "0<small> m</small>"; }
  redraw(); refreshStats();
};
$("clear").onclick = () => {
  anchors = []; segments = []; elevData = [];
  redraw();
  $("dist").innerHTML = "0<small> km</small>";
  $("dplus").innerHTML = "0<small> m</small>";
  $("elevPanel").classList.remove("show");
};

document.querySelectorAll("#layers button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#layers button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    Object.values(layers).forEach(l => map.removeLayer(l));
    layers[b.dataset.layer].addTo(map);
  };
});

redraw();

// ---------------------------------------------------------------------------
// REDIMENSIONNEMENT DU PANNEAU D'ALTITUDE
// ---------------------------------------------------------------------------
(function setupElevResize() {
  const panel = $("elevPanel");
  const handle = $("elevResizer");
  let startY = 0, startH = 0, dragging = false;

  const onDown = (e) => {
    dragging = true;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    startH = panel.getBoundingClientRect().height;
    panel.classList.add("resizing");
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const dy = startY - y;
    const maxH = window.innerHeight * 0.8;
    const newH = Math.max(80, Math.min(maxH, startH + dy));
    panel.style.height = newH + "px";
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    panel.classList.remove("resizing");
  };

  handle.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  handle.addEventListener("touchstart", onDown, { passive: false });
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("touchend", onUp);
})();

// ---------------------------------------------------------------------------
// REPÈRES KM + SURVOL DU PROFIL
// ---------------------------------------------------------------------------
$("elevMarks").addEventListener("change", () => {
  if (elevData.length) drawProfile();
});

// ---------------------------------------------------------------------------
// SÉLECTEUR DE COULEUR DU TRACÉ
// ---------------------------------------------------------------------------
(function setupColorPicker() {
  const swatches = document.querySelectorAll("#colorSwatches .sw");
  const picker = $("colorPicker");
  const applyColor = (col) => {
    traceColor = col;
    picker.value = col;
    // active le swatch correspondant (sinon aucun)
    swatches.forEach(s => s.classList.toggle("active", s.dataset.color.toLowerCase() === col.toLowerCase()));
    // redessine tout ce qui dépend de la couleur
    redraw();
    if (elevData.length) drawProfile();
    if (hoverMarker) hoverMarker.setStyle({ fillColor: shade(traceColor, 0.25) });
  };
  swatches.forEach(s => s.addEventListener("click", () => applyColor(s.dataset.color)));
  picker.addEventListener("input", (e) => applyColor(e.target.value));
})();

// ---------------------------------------------------------------------------
// BOUTON RÉDUIRE / RESTAURER (style fenêtre Windows)
// ---------------------------------------------------------------------------
(function setupMinimize() {
  const panel = $("elevPanel");
  const btn = $("elevMin");
  const icon = $("elevMinIcon");
  // SVG des deux icônes
  const ICON_MIN = '<line x1="2" y1="9" x2="10" y2="9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
  const ICON_RES = '<rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.6" rx="1"/>';
  let savedHeight = "";
  btn.addEventListener("click", () => {
    if (panel.classList.contains("minimized")) {
      panel.classList.remove("minimized");
      if (savedHeight) panel.style.height = savedHeight;
      icon.innerHTML = ICON_MIN;
      btn.title = "Réduire";
      btn.setAttribute("aria-label", "Réduire");
    } else {
      savedHeight = panel.style.height || (panel.getBoundingClientRect().height + "px");
      panel.classList.add("minimized");
      panel.style.height = "";
      icon.innerHTML = ICON_RES;
      btn.title = "Restaurer";
      btn.setAttribute("aria-label", "Restaurer");
    }
  });
})();

(function setupElevHover() {
  const wrap = $("elevSvg").parentElement;
  const svg = $("elevSvg");
  const cursor = $("elevCursor");
  const tip = $("elevTooltip");

  const hide = () => {
    cursor.style.display = "none";
    tip.style.display = "none";
    if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
  };

  wrap.addEventListener("mousemove", (e) => {
    if (!elevData.length) return;
    const rect = svg.getBoundingClientRect();
    const relX = e.clientX - rect.left;
    if (relX < 0 || relX > rect.width) return hide();
    const ratio = relX / rect.width;
    // position en distance le long du parcours
    const totalD = elevDist[elevDist.length - 1] || 1;
    const targetD = ratio * totalD;
    // recherche de l'échantillon le plus proche en distance (binaire)
    let lo = 0, hi = elevDist.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (elevDist[mid] < targetD) lo = mid + 1; else hi = mid;
    }
    let idx = lo;
    if (idx > 0 && Math.abs(elevDist[idx-1] - targetD) < Math.abs(elevDist[idx] - targetD)) idx--;
    const z = elevData[idx];
    const d = elevDist[idx] / 1000;
    const latlng = elevPts[idx];
    // position du curseur alignée sur la distance réelle de l'échantillon
    const xPx = (elevDist[idx] / totalD) * rect.width;
    cursor.style.left = xPx + "px";
    cursor.style.display = "block";
    tip.innerHTML = `<b>${d.toFixed(2)} km</b> · ${Math.round(z)} m`;
    tip.style.display = "block";
    // garde le tooltip dans les limites
    const tipW = tip.offsetWidth;
    let left = xPx;
    if (left - tipW/2 < 4) left = tipW/2 + 4;
    if (left + tipW/2 > rect.width - 4) left = rect.width - tipW/2 - 4;
    tip.style.left = left + "px";
    tip.style.top = "0px";
    // marqueur sur la carte (couleur dérivée du tracé)
    if (latlng) {
      const hoverColor = shade(traceColor, 0.25);
      if (!hoverMarker) {
        hoverMarker = L.circleMarker(latlng, {
          radius: 7, color: "#fff", weight: 2,
          fillColor: hoverColor, fillOpacity: 1,
          interactive: false
        }).addTo(map);
      } else {
        hoverMarker.setLatLng(latlng).setStyle({ fillColor: hoverColor });
      }
    }
  });
  wrap.addEventListener("mouseleave", hide);
})();

// nettoie le marqueur de survol quand on efface tout
const _origClear = $("clear").onclick;
$("clear").onclick = () => {
  if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
  elevPts = [];
  _origClear();
};
</script>
